name: CatCleaner CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m

      - name: CatCleaner build preflight
        run: |
          ./scripts/build-preflight.sh --app
          ./scripts/build-preflight.sh --tests

      - name: Verify VERSION ↔ MCConstants.appVersion sync
        run: bash scripts/check-version-sync.sh

      - name: Verify fail-closed release workflow contract
        run: python3 scripts/check-release-contract.py

      - name: Build core
        run: swift build --target MacCleanKit

      - name: Build app products
        run: |
          swift build --product MacClean
          swift build --product MacCleanMenu

      - name: Run XCTest suite with code coverage
        run: swift test --enable-code-coverage

      - name: Verify coverage profile exists
        run: |
          PROF=$(find .build -name '*.profdata' | head -1)
          if [ -z "$PROF" ]; then
            echo "::error::No coverage profile found"
            exit 1
          fi
          echo "Coverage profile: $PROF"

      - name: Build native ad-hoc CatCleaner.app bundle
        run: |
          BUILD_ARCHS="--arch $(uname -m)" ./scripts/build-dmg.sh --app-only

      - name: Verify CatCleaner.app bundle identity
        run: |
          APP=".build/dmg/CatCleaner.app"
          MENU="$APP/Contents/Library/LoginItems/MacCleanMenu.app"

          test -d "$APP"
          test -d "$MENU"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.catcleaner.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$MENU/Contents/Info.plist")" = "com.catcleaner.menu"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Contents/Info.plist" |
            grep -Fx 'catcleaner'

          /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations' "$APP/Contents/Info.plist" |
            grep -F 'zh-Hant-TW'

          codesign --verify --deep --strict "$APP"

          if find "$APP" -type f -maxdepth 8 -print0 |
             xargs -0 strings 2>/dev/null |
             grep -E 'com\.macclean|macclean://|brew upgrade --cask mac-sai' ; then
            echo "::error::Upstream runtime identity leaked into CatCleaner.app"
            exit 1
          fi

      - name: Safety-critical file presence
        run: |
          required=(
            Sources/MacCleanKit/SafetyGuard.swift
            Sources/MacCleanKit/PlistJunkFilter.swift
            Tests/MacCleanKitTests/SafetyGuardTests.swift
            Tests/MacCleanKitTests/PlistJunkFilterTests.swift
            Tests/MacCleanTests/CleaningEngineTests.swift
            Tests/MacCleanTests/ReleaseIsolationTests.swift
            Tests/MacCleanKitTests/DeveloperCleanupTests.swift
            Tests/MacCleanKitTests/SimilarPhotoGroupingTests.swift
            Tests/MacCleanKitTests/ProcessOutputCaptureTests.swift
          )
          for path in "${required[@]}"; do
            test -f "$path" || {
              echo "::error::Safety-critical file missing: $path"
              exit 1
            }
          done

  security-audit:
    name: Safety & Downstream Isolation Audit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Check for likely hardcoded secrets
        run: |
          if rg -n --glob '*.swift'             '(api[_-]?key|client[_-]?secret|password|token)\s*[:=]\s*"[^"]{8,}"'             Sources; then
            echo "::error::Potential hardcoded secret found"
            exit 1
          fi
          echo "No likely hardcoded Swift secrets found."

      - name: Verify downstream runtime identity isolation
        run: |
          forbidden=$(rg -n             'com\.macclean|macclean://|brew upgrade --cask mac-sai|Mac Sai\.app|MacSai-'             Sources scripts Package.swift 2>/dev/null || true)
          if [ -n "$forbidden" ]; then
            echo "$forbidden"
            echo "::error::Upstream runtime/release identity leaked into CatCleaner"
            exit 1
          fi

          rg -n 'public static let updateChecksEnabled = false'             Sources/MacCleanKit/Constants.swift >/dev/null
          rg -n 'public static let teamIdentifier: String\? = nil'             Sources/MacCleanKit/Constants.swift >/dev/null

          # A future CatCleaner-owned icon is allowed, but the exact upstream
          # Mac Sai icon must never silently return to this downstream product.
          if [ -f Resources/AppIcon.icns ]; then
            icon_sha=$(shasum -a 256 Resources/AppIcon.icns | awk '{print $1}')
            if [ "$icon_sha" = "216276c7544ea99500930c333b55bb740689c0b60c079ce7b4b1e4cf459ede9f" ]; then
              echo "::error::Upstream Mac Sai AppIcon returned unchanged"
              exit 1
            fi
          fi

      - name: Verify Smart Scan preselection stays fail-closed
        run: |
          if rg -n 'autoSelect:\s*true' Sources; then
            echo "::error::Product code must not force autoSelect=true"
            exit 1
          fi
          if rg -n 'LanguageFilesCategory\(\)'             Sources/MacClean/Modules/SystemJunk/SystemJunkModule.swift; then
            echo "::error::Language-file deletion must remain unregistered"
            exit 1
          fi

          for file in \
            Sources/MacClean/Views/Protection/MalwareView.swift \
            Sources/MacClean/Views/Protection/PrivacyView.swift \
            Sources/MacClean/Views/Cleanup/TrashBinsView.swift \
            Sources/MacClean/Views/Cleanup/MailAttachmentsView.swift \
            Sources/MacClean/Views/Files/DuplicatesView.swift
          do
            rg -n 'ScanSelectionPolicy\.defaultSelection' "$file" >/dev/null || {
              echo "::error::Dedicated cleanup view bypasses central selection policy: $file"
              exit 1
            }
          done

          if rg -n 'for r in results \{ selectedItems\.formUnion' \
            Sources/MacClean/Views/Protection; then
            echo "::error::Protection view directly preselects every scan result"
            exit 1
          fi

          if rg -n 'selectedItems = Set\(removable\.map' \
            Sources/MacClean/Views/Files/DuplicatesView.swift; then
            echo "::error::Duplicates must start review-only, not fully preselected"
            exit 1
          fi

      - name: Verify process pipe draining order
        run: python3 scripts/check-process-pipe-order.py

      - name: Check deletion surfaces
        run: |
          UNSAFE=$(rg -n             'removeItem\(|trashItem\('             Sources/MacClean --glob '*.swift' |
            grep -vE 'SafetyGuard|CleaningEngine|SecureEraser|MaintenanceModule|UninstallerView|RemovedAppLeftoversView|DeveloperCleanupExecutor|dryRun|// ' || true)
          if [ -n "$UNSAFE" ]; then
            echo "::warning::Review file deletion outside canonical cleanup paths:"
            echo "$UNSAFE"
          fi

      - name: Verify network surface is bounded and non-telemetry
        run: python3 scripts/check-network-surface.py
