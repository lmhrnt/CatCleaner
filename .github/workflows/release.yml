name: CatCleaner Release (disabled)

on:
  workflow_dispatch:

jobs:
  release-disabled:
    runs-on: macos-latest
    steps:
      - name: Release infrastructure not configured
        run: |
          echo "CatCleaner release publishing is intentionally disabled."
          echo "Configure CatCleaner-owned repository, Developer ID, notary profile, release assets, and cask before enabling this workflow."
          exit 1
