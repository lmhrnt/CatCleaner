name: CatCleaner Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the notarized DMG from an existing version tag"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catcleaner-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.publish == true }}
    runs-on: macos-latest
    steps:
      - name: Check out the selected tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify immutable release boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]] || {
            echo "Release must be dispatched from an existing v* tag." >&2
            exit 78
          }
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "v${version}" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION=$version." >&2
            exit 78
          }
          ./scripts/check-version-sync.sh
          git diff --exit-code
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DMG_PATH=.build/CatCleaner-${version}.dmg" >> "$GITHUB_ENV"

      - name: Require CatCleaner signing and notarization secrets
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CATCLEANER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CATCLEANER_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.CATCLEANER_APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.CATCLEANER_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.CATCLEANER_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_P12_BASE64:?missing CATCLEANER_CERTIFICATE_P12_BASE64}"
          : "${CERTIFICATE_PASSWORD:?missing CATCLEANER_CERTIFICATE_PASSWORD}"
          : "${APPLE_ID:?missing CATCLEANER_APPLE_ID}"
          : "${APPLE_APP_PASSWORD:?missing CATCLEANER_APP_PASSWORD}"
          : "${APPLE_TEAM_ID:?missing CATCLEANER_TEAM_ID}"
          [[ "$APPLE_TEAM_ID" != "H3XLS95QV4" ]] || {
            echo "Refusing upstream Mac Sai Developer Team ID." >&2
            exit 78
          }

      - name: Configure ephemeral signing keychain
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CATCLEANER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CATCLEANER_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.CATCLEANER_APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.CATCLEANER_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.CATCLEANER_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/catcleaner-ci.keychain-db"
          certificate="$RUNNER_TEMP/catcleaner-developer-id.p12"
          keychain_password="$(uuidgen)"
          profile="CatCleaner-CI-${GITHUB_RUN_ID}"

          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null

          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          [[ -n "$identity" ]] || {
            echo "No Developer ID Application identity found in imported certificate." >&2
            exit 78
          }
          [[ "$identity" == *"($APPLE_TEAM_ID)"* ]] || {
            echo "Developer ID identity does not match CATCLEANER_TEAM_ID." >&2
            exit 78
          }
          [[ "$identity" != *"H3XLS95QV4"* ]] || {
            echo "Refusing upstream Mac Sai Developer ID." >&2
            exit 78
          }

          xcrun notarytool store-credentials "$profile"             --apple-id "$APPLE_ID"             --team-id "$APPLE_TEAM_ID"             --password "$APPLE_APP_PASSWORD"             --keychain "$keychain"

          echo "APPLE_DEVELOPER_ID=$identity" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=$profile" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple
        shell: bash
        run: ./scripts/build-dmg.sh --notarize

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          app=".build/dmg/CatCleaner.app"
          test -d "$app"
          test -f "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$DMG_PATH"
          shasum -a 256 "$DMG_PATH"

      - name: Upload notarized DMG evidence
        uses: actions/upload-artifact@v7
        with:
          name: "CatCleaner-${{ env.VERSION }}-notarized"
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error

      - name: Publish GitHub release from existing tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$DMG_PATH"             --verify-tag             --title "CatCleaner ${VERSION}"             --generate-notes

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/catcleaner-ci.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/catcleaner-developer-id.p12"
